name: GoStay CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          count=0

          while IFS= read -r -d '' file; do
            echo "Checking: $file"
            node --check "$file"
            count=$((count + 1))
          done < <(find frontend/js -type f -name '*.js' -print0)

          if [ "$count" -eq 0 ]; then
            echo "No JavaScript files were found."
            exit 1
          fi

          echo "Checked $count JavaScript files successfully."

      - name: Check unresolved merge conflicts
        shell: bash
        run: |
          set -euo pipefail

          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- frontend supabase docs; then
            echo "Unresolved Git merge conflict markers were found."
            exit 1
          fi

          echo "No unresolved merge conflicts found."

      - name: Ensure .env is not committed
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo "A tracked environment file was found."
            echo "Remove it from Git and keep only .env.example with placeholder values."
            exit 1
          fi

          echo "No tracked secret environment file found."

  security-runtime:
    name: Runtime security tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gostay-shared-security-runtime
      cancel-in-progress: false
    env:
      GOSTAY_SECURITY_API_URL: ${{ secrets.GOSTAY_SECURITY_API_URL }}
      GOSTAY_E2E_EMAIL: ${{ secrets.GOSTAY_E2E_EMAIL }}
      GOSTAY_E2E_PASSWORD: ${{ secrets.GOSTAY_E2E_PASSWORD }}
      GOSTAY_E2E_CUSTOMER_B_EMAIL: ${{ secrets.GOSTAY_E2E_CUSTOMER_B_EMAIL }}
      GOSTAY_E2E_CUSTOMER_B_PASSWORD: ${{ secrets.GOSTAY_E2E_CUSTOMER_B_PASSWORD }}
      GOSTAY_E2E_ADMIN_EMAIL: ${{ secrets.GOSTAY_E2E_ADMIN_EMAIL }}
      GOSTAY_E2E_ADMIN_PASSWORD: ${{ secrets.GOSTAY_E2E_ADMIN_PASSWORD }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Check security test secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [ -n "$GOSTAY_SECURITY_API_URL" ] || missing+=("GOSTAY_SECURITY_API_URL")
          [ -n "$GOSTAY_E2E_EMAIL" ] || missing+=("GOSTAY_E2E_EMAIL")
          [ -n "$GOSTAY_E2E_PASSWORD" ] || missing+=("GOSTAY_E2E_PASSWORD")
          [ -n "$GOSTAY_E2E_CUSTOMER_B_EMAIL" ] || missing+=("GOSTAY_E2E_CUSTOMER_B_EMAIL")
          [ -n "$GOSTAY_E2E_CUSTOMER_B_PASSWORD" ] || missing+=("GOSTAY_E2E_CUSTOMER_B_PASSWORD")
          [ -n "$GOSTAY_E2E_ADMIN_EMAIL" ] || missing+=("GOSTAY_E2E_ADMIN_EMAIL")
          [ -n "$GOSTAY_E2E_ADMIN_PASSWORD" ] || missing+=("GOSTAY_E2E_ADMIN_PASSWORD")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required repository secrets: ${missing[*]}"
            exit 1
          fi

          echo "All required runtime security test secrets are configured."

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run runtime security tests
        run: npm run test:security

  e2e-pr-notice:
    name: Customer booking E2E notice
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Explain E2E stabilization gate
        run: |
          echo "Customer booking E2E is skipped on Pull Requests during stabilization."
          echo "This also prevents forked Pull Requests from attempting to access E2E secrets."
          echo "Run the E2E job explicitly with workflow_dispatch."

  e2e:
    name: Customer booking E2E
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: gostay-shared-e2e
      cancel-in-progress: false
    env:
      GOSTAY_E2E_EMAIL: ${{ secrets.GOSTAY_E2E_EMAIL }}
      GOSTAY_E2E_PASSWORD: ${{ secrets.GOSTAY_E2E_PASSWORD }}
      GOSTAY_E2E_GUEST_NAME: ${{ secrets.GOSTAY_E2E_GUEST_NAME }}
      GOSTAY_E2E_GUEST_PHONE: ${{ secrets.GOSTAY_E2E_GUEST_PHONE }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Check E2E secrets
        id: e2e-secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [ -n "$GOSTAY_E2E_EMAIL" ] || missing+=("GOSTAY_E2E_EMAIL")
          [ -n "$GOSTAY_E2E_PASSWORD" ] || missing+=("GOSTAY_E2E_PASSWORD")
          [ -n "$GOSTAY_E2E_GUEST_NAME" ] || missing+=("GOSTAY_E2E_GUEST_NAME")
          [ -n "$GOSTAY_E2E_GUEST_PHONE" ] || missing+=("GOSTAY_E2E_GUEST_PHONE")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Skipping customer booking E2E. Missing repository secrets: ${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "All required E2E secrets are configured."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.e2e-secrets.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.e2e-secrets.outputs.ready == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.e2e-secrets.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run customer booking E2E
        if: steps.e2e-secrets.outputs.ready == 'true'
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure() && steps.e2e-secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
