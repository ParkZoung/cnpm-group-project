<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="images/logo-gostay.png">
  <title>GoStay Admin - Quản lý phòng</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/bach.css">
</head>
<body class="admin-dashboard-body">

  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <img src="images/sos.png" alt="GoStay Logo" class="sidebar-logo">
    </div>
    <nav class="sidebar-menu">
      <a href="admin-dashboard.html" class="menu-item"><span class="icon">📊</span> Dashboard</a>
      <a href="admin-products.html" class="menu-item active"><span class="icon">🛏️</span> Quản lý phòng</a>
      <a href="admin-room-types.html" class="menu-item "><span class="icon">🏷️</span> Quản lý loại phòng</a>
      <a href="admin-categories.html" class="menu-item"><span class="icon">📁</span> Quản lý chi nhánh</a>
      <a href="admin-bookings.html" class="menu-item"><span class="icon">📄</span> Quản lý booking</a>
      <a href="admin-users.html" class="menu-item"><span class="icon">👥</span> Khách hàng</a>
      <hr class="sidebar-divider">
      <a href="login.html" class="menu-item logout-item"><span class="icon">🚪</span> Đăng xuất</a>
    </nav>
  </aside>

  <div class="admin-main-content">
    <header class="admin-topbar">
      <div class="topbar-left"><h1 class="topbar-title">Quản lý phòng</h1></div>
      <div class="topbar-right">
        <div class="topbar-search"><input type="text" placeholder="Tìm kiếm phòng..."></div>
        <div class="topbar-user"><span class="user-name">Admin Khánh ▾</span></div>
      </div>
    </header>

    <main class="admin-page-container">
      <div class="admin-card-section" style="margin-bottom: 24px;">
        <div class="section-header-row">
          <h2 id="room-form-title">Thêm phòng mới</h2>
        </div>

        <form id="room-form">
          <input type="hidden" id="room-id">

          <div class="admin-filter-bar" style="flex-wrap: wrap;">
            <div style="flex: 1 1 160px;">
              <label style="display:block; font-size:12px; font-weight:600; color:#475569; margin-bottom:4px;">Số phòng *</label>
              <input type="text" id="room-number" placeholder="VD: 101" class="admin-search-input" required>
            </div>
            <div style="flex: 1 1 220px;">
              <label style="display:block; font-size:12px; font-weight:600; color:#475569; margin-bottom:4px;">Tên phòng *</label>
              <input type="text" id="room-name" placeholder="VD: Deluxe Sea View 101" class="admin-search-input" required>
            </div>
            <div style="flex: 1 1 200px;">
              <label style="display:block; font-size:12px; font-weight:600; color:#475569; margin-bottom:4px;">Chi nhánh *</label>
              <select id="room-branch" class="admin-select-filter" style="width:100%;" required>
                <option value="">-- Chọn chi nhánh --</option>
              </select>
            </div>
            <div style="flex: 1 1 200px;">
              <label style="display:block; font-size:12px; font-weight:600; color:#475569; margin-bottom:4px;">Loại phòng *</label>
              <select id="room-type" class="admin-select-filter" style="width:100%;" required>
                <option value="">-- Chọn loại phòng --</option>
              </select>
            </div>
            <div style="flex: 1 1 160px;">
              <label style="display:block; font-size:12px; font-weight:600; color:#475569; margin-bottom:4px;">Giá / đêm (VNĐ) *</label>
              <input type="number" id="room-price" min="1" placeholder="VD: 700000" class="admin-search-input" required>
            </div>
            <div style="flex: 1 1 160px;">
              <label style="display:block; font-size:12px; font-weight:600; color:#475569; margin-bottom:4px;">Trạng thái *</label>
              <select id="room-status" class="admin-select-filter" style="width:100%;" required>
                <option value="available">Còn trống</option>
                <option value="maintenance">Đang dọn</option>
                <option value="inactive">Hết phòng</option>
              </select>
            </div>
            <div style="flex: 1 1 100%;">
              <label style="display:block; font-size:12px; font-weight:600; color:#475569; margin-bottom:4px;">Mô tả</label>
              <input type="text" id="room-description" placeholder="Mô tả thêm (không bắt buộc)" class="admin-search-input">
            </div>
          </div>

          <div style="margin-top: 14px; display:flex; gap:10px; align-items:center;">
            <button type="submit" id="room-submit-btn" class="btn-primary-admin">Lưu phòng</button>
            <button type="button" id="room-reset-btn" class="btn-action edit">Làm mới form</button>
            <span id="room-message" style="font-size:13px;"></span>
          </div>
        </form>
      </div>

      <div class="admin-card-section">
        <div class="section-header-row">
          <h2>Danh sách phòng</h2>
        </div>

        <div class="admin-filter-bar">
          <input type="text" id="room-search" placeholder="Tìm theo mã, tên phòng..." class="admin-search-input">
          <select id="room-filter-branch" class="admin-select-filter">
            <option value="">Tất cả chi nhánh</option>
          </select>
          <select id="room-filter-status" class="admin-select-filter">
            <option value="">Tất cả trạng thái</option>
            <option value="available">Còn trống</option>
            <option value="maintenance">Đang dọn</option>
            <option value="inactive">Hết phòng</option>
          </select>
          <select id="room-sort" class="admin-select-filter">
            <option value="">Sắp xếp mặc định</option>
            <option value="price-asc">Giá thấp → cao</option>
            <option value="price-desc">Giá cao → thấp</option>
          </select>
          <button id="room-filter-btn" class="btn-primary-admin">Lọc</button>
        </div>

        <div class="admin-table-wrapper">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Mã phòng</th>
                <th>Tên phòng</th>
                <th>Hạng phòng</th>
                <th>Chi nhánh</th>
                <th>Giá / đêm</th>
                <th>Trạng thái</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody id="room-table-body">
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <footer class="admin-footer">
      <p>© 2026 GoStay Admin Control Panel. <span style="float: right;">Version 1.2.0</span></p>
    </footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-rooms.js"></script>
</body>
</html>
